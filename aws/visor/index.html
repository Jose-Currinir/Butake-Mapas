<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Butake Mapas · Chile</title>
  <meta name="description" content="Mapa vectorial de Chile de Butake: estilos claro y oscuro para web, Android e iOS.">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f7a4d'/%3E%3Cpath d='M16 6c-4 0-7 3-7 7 0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7zm0 10a3 3 0 110-6 3 3 0 010 6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" crossorigin="anonymous">
  <style>
    :root {
      --verde: #1f7a4d; --verde-suave: #e7f3ec;
      --fondo: rgba(255, 255, 255, .86); --texto: #17201b; --tenue: #5d6b63; --borde: rgba(23, 32, 27, .1);
      --sombra: 0 10px 30px rgba(15, 30, 22, .14), 0 1px 3px rgba(15, 30, 22, .08);
    }
    [data-tema="oscuro"] {
      --verde: #3fb67a; --verde-suave: rgba(63, 182, 122, .16);
      --fondo: rgba(20, 26, 23, .82); --texto: #eef3f0; --tenue: #9fb0a7; --borde: rgba(255, 255, 255, .1);
      --sombra: 0 10px 30px rgba(0, 0, 0, .45);
    }
    * { box-sizing: border-box; }
    html, body, #mapa { margin: 0; height: 100%; }
    body { font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--texto); }

    .tarjeta {
      position: absolute; z-index: 2; top: 16px; left: 16px; width: 320px;
      background: var(--fondo); color: var(--texto);
      backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border: 1px solid var(--borde); border-radius: 16px; box-shadow: var(--sombra);
      padding: 16px; transition: background .25s, color .25s;
    }
    .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--verde); display: grid; place-items: center; flex: none; }
    .marca h1 { font-size: 16px; margin: 0; letter-spacing: -.01em; }
    .marca p { margin: 0; font-size: 12px; color: var(--tenue); }

    .segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--verde-suave); }
    .segmento button {
      display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px;
      border: 0; border-radius: 9px; background: transparent; color: var(--texto); font: 600 13px/1 inherit; cursor: pointer;
    }
    .segmento button[aria-pressed="true"] { background: var(--verde); color: #fff; box-shadow: 0 2px 6px rgba(31, 122, 77, .35); }
    .segmento button:focus-visible, .lugares button:focus-visible, .copiar:focus-visible { outline: 2px solid var(--verde); outline-offset: 2px; }

    .titulo { margin: 16px 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); }
    .lugares { display: flex; flex-wrap: wrap; gap: 6px; }
    .lugares button {
      height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--borde);
      background: transparent; color: var(--texto); font: 500 12.5px/1 inherit; cursor: pointer;
    }
    .lugares button:hover { border-color: var(--verde); color: var(--verde); }

    .url { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border: 1px solid var(--borde); border-radius: 10px; }
    .url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--tenue); }
    .copiar { flex: none; height: 28px; padding: 0 10px; border: 0; border-radius: 7px; background: var(--verde-suave); color: var(--verde); font: 600 12px/1 inherit; cursor: pointer; }

    .estado {
      position: absolute; z-index: 2; left: 16px; bottom: 16px; padding: 7px 12px; border-radius: 999px;
      background: var(--fondo); color: var(--tenue); border: 1px solid var(--borde); box-shadow: var(--sombra);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .maplibregl-ctrl-group { border-radius: 12px !important; overflow: hidden; box-shadow: var(--sombra) !important; }
    .maplibregl-ctrl-top-right { top: 6px; right: 6px; }
    [data-tema="oscuro"] .maplibregl-ctrl-group { background: #1c2420; }
    [data-tema="oscuro"] .maplibregl-ctrl-group button + button { border-top-color: rgba(255, 255, 255, .08); }
    [data-tema="oscuro"] .maplibregl-ctrl-icon { filter: invert(1) hue-rotate(180deg); }
    [data-tema="oscuro"] .maplibregl-ctrl-scale { background: rgba(20, 26, 23, .7); color: #cfd9d3; border-color: #cfd9d3; }

    @media (max-width: 560px) {
      .tarjeta { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; padding: 14px; }
      .marca { margin-bottom: 12px; }
      .titulo { margin-top: 12px; }
      .lugares { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 2px; }
      .lugares::-webkit-scrollbar { display: none; }
      .lugares button { flex: none; }
      .estado, .url, .titulo-url { display: none; }
      .maplibregl-ctrl-bottom-right { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="tarjeta" aria-label="Controles del mapa">
    <div class="marca">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      </div>
      <div>
        <h1>Butake Mapas</h1>
        <p>Chile · vectorial · claro y oscuro</p>
      </div>
    </div>

    <div class="segmento" role="group" aria-label="Estilo">
      <button type="button" data-estilo="cl-light" aria-pressed="true">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Claro
      </button>
      <button type="button" data-estilo="cl-dark" aria-pressed="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        Oscuro
      </button>
    </div>

    <p class="titulo">Ir a</p>
    <div class="lugares">
      <button type="button" data-lugar="-70.3126,-18.4783,12">Arica</button>
      <button type="button" data-lugar="-70.4001,-23.6509,12">Antofagasta</button>
      <button type="button" data-lugar="-71.6127,-33.0472,12.5">Valparaíso</button>
      <button type="button" data-lugar="-70.6483,-33.4489,11.5">Santiago</button>
      <button type="button" data-lugar="-73.0498,-36.8270,12">Concepción</button>
      <button type="button" data-lugar="-72.9424,-41.4693,12">Puerto Montt</button>
      <button type="button" data-lugar="-70.9171,-53.1638,12">Punta Arenas</button>
      <button type="button" data-lugar="-71.0,-37.5,4.6">Todo Chile</button>
    </div>

    <p class="titulo titulo-url">Estilo para tu app</p>
    <div class="url">
      <code id="url"></code>
      <button type="button" class="copiar" id="copiar">Copiar</button>
    </div>
  </main>

  <div class="estado" id="estado" aria-live="off"></div>
  <div id="mapa"></div>

  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script>
    // En una copia local o de prueba, los estilos vienen del servicio publicado.
    const base = location.hostname.endsWith('butake.cl') ? location.origin : 'https://mapas.butake.cl'
    const url = (e) => `${base}/styles/${e}/style.json`
    const oscuro = matchMedia('(prefers-color-scheme: dark)').matches
    let estilo = new URLSearchParams(location.search).get('estilo') || (oscuro ? 'cl-dark' : 'cl-light')

    const mapa = new maplibregl.Map({
      container: 'mapa', style: url(estilo), center: [-70.6483, -33.4489], zoom: 11, hash: true,
      attributionControl: { compact: true },
    })
    mapa.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right')
    mapa.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true } }), 'top-right')
    mapa.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right')

    const pintar = () => {
      document.documentElement.dataset.tema = estilo === 'cl-dark' ? 'oscuro' : 'claro'
      document.getElementById('url').textContent = url(estilo)
      for (const b of document.querySelectorAll('[data-estilo]')) b.setAttribute('aria-pressed', String(b.dataset.estilo === estilo))
    }
    pintar()

    for (const b of document.querySelectorAll('[data-estilo]')) {
      b.addEventListener('click', () => {
        if (b.dataset.estilo === estilo) return
        estilo = b.dataset.estilo
        mapa.setStyle(url(estilo))
        pintar()
      })
    }

    for (const b of document.querySelectorAll('[data-lugar]')) {
      b.addEventListener('click', () => {
        const [lng, lat, zoom] = b.dataset.lugar.split(',').map(Number)
        const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches
        mapa[quieto ? 'jumpTo' : 'flyTo']({ center: [lng, lat], zoom, speed: 1.4 })
      })
    }

    const copiar = document.getElementById('copiar')
    copiar.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(url(estilo)); copiar.textContent = 'Copiado' } catch { copiar.textContent = 'No se pudo' }
      setTimeout(() => { copiar.textContent = 'Copiar' }, 1600)
    })

    const estado = document.getElementById('estado')
    const mostrar = () => {
      const c = mapa.getCenter()
      estado.textContent = `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)} · z${mapa.getZoom().toFixed(1)}`
    }
    mapa.on('move', mostrar)
    mapa.on('load', mostrar)
  </script>
</body>
</html>
